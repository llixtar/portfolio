      <stop offset="0%" stop-color="#9ca3af" />
      <stop offset="50%" stop-color="#4b5563" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="obsidian" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e232e" />
      <stop offset="55%" stop-color="#11141c" />
      <stop offset="100%" stop-color="#07090d" />
